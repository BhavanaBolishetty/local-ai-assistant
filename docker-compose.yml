services:
  backend:
    build: .
    command: uv run uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      # Ollama stays on the host, exactly as it does outside Docker —
      # containerizing Ollama itself would add GPU-passthrough/model-volume
      # complexity for a feature that already works fine without it.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      # Docker Desktop resolves host.docker.internal automatically; this
      # makes it work on native Linux Docker Engine too (20.10+).
      - "host.docker.internal:host-gateway"
    env_file:
      - .env

  frontend:
    build: .
    command: uv run streamlit run apps/streamlit/app.py --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      # Overrides .env's API_HOST=127.0.0.1 so Streamlit reaches the
      # backend by its compose service name instead of localhost.
      - API_HOST=backend
      - API_PORT=8000
    depends_on:
      - backend
    env_file:
      - .env
