[project]
name = "local-ai-assistant"
version = "0.1.0"
description = "A local, tool-using AI assistant powered by a small language model via Ollama."
authors = [
    { name = "BhavanaBolishetty", email = "bhavanabolishetty3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.60.0",
    "uvicorn[standard]>=0.52.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends() is designed to be used as a call in argument
# defaults - it's re-invoked per-request by Starlette, not evaluated once
# at import time like a normal mutable default. False positive here.
ignore = ["B008"]
